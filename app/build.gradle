plugins {
    id 'com.android.application'
    id 'com.android.legacy-kapt'
    id 'com.google.gms.google-services'
    id("com.google.dagger.hilt.android")
}

def cryptoCompareApiKey = project.findProperty("cryptocompareApiKey") ?: System.getenv("CRYPTOCOMPARE_API_KEY") ?: ""



android {
    namespace 'com.example.shahicripto'
    compileSdk 34

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    defaultConfig {
        applicationId "com.example.shahicripto"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "1.6"

        buildConfigField "String", "CRYPTOCOMPARE_API_KEY", "\"${cryptoCompareApiKey}\""


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}



dependencies {

    configurations.configureEach {
        resolutionStrategy.force 'androidx.core:core:1.12.0', 'androidx.core:core-ktx:1.12.0'
    }

    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'


    // server =>
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava3:3.0.0'

    // show chart =>
    implementation 'com.robinhood.spark:spark:1.2.0'

    // swipe refresh =>
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    //Glide =>
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // On-device English/Persian news translation
    implementation 'com.google.mlkit:translate:17.0.3'

    // sweet alert dialog =>
    // Adding Sweet Alert Library
    implementation 'com.github.f0ris.sweetalert:library:1.6.2'

    //rxJava
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'

    //room =>
    //ROOM
    implementation "androidx.room:room-runtime:2.8.4"
    kapt 'androidx.room:room-compiler:2.8.4'
    implementation("androidx.room:room-rxjava3:2.8.4")

   // Hilt =>
    implementation("com.google.dagger:hilt-android:2.60.1")
    kapt("com.google.dagger:hilt-compiler:2.60.1")

    //Motion Toast =>
    implementation "com.github.Spikeysanju:MotionToast:1.4"

}

kapt {
    correctErrorTypes = true
}
